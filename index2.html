<!DOCTYPE html>
<html>
  <head>
    <title>Weather Graph</title>
    <link rel='stylesheet' type='text/css' href='css/slate.min.css'>
    <script src='js/slate.min.js'></script>
    <style>
      .title {
        padding: 15px 10px;
        text-transform: uppercase;
        font-family: 'PT Sans', sans-serif;
        font-size: 1.2em;
        font-weight: 500;
        color: #888888;
        text-align: center;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
      }
      table, th, td {
        border: 1px solid black;
        text-align: left;
        padding: 5px;
      }
      .button-container {
        text-align: center;
        margin-top: 20px;
      }
    </style>
  </head>

  <body>
    <h1 class='title'>Weather Graph</h1>

    <div class='item-container'>
      <div class='item-container-header'>Position</div>
      <div class='item-container-content'>
        <label class='item'>
          GPS
          <input id='gps' type='checkbox' class='item-toggle'>
        </label>
      </div>
    </div>

    <div class='item-container'>
      <div class='item-container-header'>Units</div>
      <div class='item-container-content'>
        <label class='item'>
          Imperial
          <input type='radio' class='item-radio' name='radio_units' value='imperial'>
        </label>
        <label class='item'>
          Metric
          <input type='radio' class='item-radio' name='radio_units' value='metric' checked>
        </label>
      </div>
    </div>

    <!-- Table with city name, longitude, and latitude -->
    <div class='item-container'>
      <div class='item-container-header'>Cities</div>
      <div class='item-container-content'>
        <table id='cityTable'>
          <thead>
            <tr>
              <th>City Name</th>
              <th>Longitude</th>
              <th>Latitude</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><input type='text' placeholder='City Name'></td>
              <td><input type='text' placeholder='Longitude'></td>
              <td><input type='text' placeholder='Latitude'></td>
              <td><button type='button' onclick='deleteRow(this)'>Delete</button></td>
            </tr>
          </tbody>
        </table>
        <button type='button' onclick='addRow()'>Add Row</button>
      </div>
    </div>

    <div class='item-container'>
      <div class='button-container'>
        <input id='submit_button' type='button' class='item-button' value='SUBMIT'>
      </div>
    </div>

    <!-- Image at the end of the document -->
    <div class='item-container'>
      <div class='item-container-header'></div>
      <div class='item-container-content'>
        <label class='item'>
          <img src="lwYK0MI_.png" style="width:300px;height:360px;">
        </label>
      </div>
    </div>

    <script>
      // Add a new row to the table
      function addRow() {
        var table = document.getElementById('cityTable').getElementsByTagName('tbody')[0];
        var newRow = table.insertRow();
        newRow.innerHTML = `
          <td><input type='text' placeholder='City Name'></td>
          <td><input type='text' placeholder='Longitude'></td>
          <td><input type='text' placeholder='Latitude'></td>
          <td><button type='button' onclick='deleteRow(this)'>Delete</button></td>`;
      }

      // Delete a row from the table
      function deleteRow(button) {
        var row = button.parentNode.parentNode;
        row.parentNode.removeChild(row);
      }

      // Get configured data
      function getConfigData() {
        var gps = document.getElementById('gps').checked;
        var unit = document.querySelector('input[name="radio_units"]:checked').value;

        // Retrieve table data
        var cityTable = document.getElementById('cityTable').getElementsByTagName('tbody')[0];
        var cities = [];
        for (var i = 0; i < cityTable.rows.length; i++) {
          var row = cityTable.rows[i];
          var cityName = row.cells[0].querySelector('input').value;
          var longitude = row.cells[1].querySelector('input').value;
          var latitude = row.cells[2].querySelector('input').value;
          cities.push({ cityName, longitude, latitude });
        }

        var options = {
          'gps': gps,
          'unit': unit,
          'cities': cities
        };

        console.log('Got options: ' + JSON.stringify(options));
        return options;
      }

      // Submit button event handler
      var submitButton = document.getElementById('submit_button');
      submitButton.addEventListener('click', function() {
        console.log('Submit');
        var return_to = 'pebblejs://close#';  // Default return URL
        document.location = return_to + encodeURIComponent(JSON.stringify(getConfigData()));
      });

    </script>
  </body>
</html>
